<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Botthew Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* Dark blue-grey outside */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.7);
            color: #bdc3c7; /* Light grey text */
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            border: 2px solid #34495e;
            max-width: 300px;
        }
        h1 { margin: 0 0 10px 0; color: #f1c40f; font-size: 18px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .stat-label { color: #7f8c8d; }
        .stat-val { color: #ecf0f1; font-weight: bold; }
        #message { margin-top: 10px; font-style: italic; color: #1abc9c; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="status-box">
                <h1>STATUS LOG</h1>
                <div class="stat-row">
                    <span class="stat-label">SYSTEM:</span>
                    <span class="stat-val" id="status-val">LOADING...</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">TASK:</span>
                    <span class="stat-val" id="task">...</span>
                </div>
                <div id="message"></div>
            </div>
        </div>
    </div>

    <script src="render.js"></script>
</body>
</html>
