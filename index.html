<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Botthew Activity Monitor</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
        }
        #monitor {
            border: 4px solid #00FF00;
            padding: 20px;
            width: 600px;
            max-width: 90vw; /* Prevent cutoff on mobile */
            box-shadow: 0 0 20px #00FF00, 0 0 5px #00AA00 inset;
            text-align: center;
            background: rgba(0, 20, 0, 0.9);
            transition: box-shadow 0.5s, border-color 0.5s;
        }
        #avatar {
            white-space: pre;
            font-size: 14px;
            line-height: 14px;
            margin-bottom: 20px;
            color: #00FF00;
            font-weight: bold;
        }
        
        /* Animations */
        .anim-idle { animation: idleBounce 2s infinite ease-in-out; }
        .anim-working { animation: workingPulse 0.2s infinite alternate; }
        .anim-happy { animation: happyJump 0.5s infinite; }
        .anim-alert { animation: alertShake 0.1s infinite; color: #FF0000 !important; }

        @keyframes idleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes workingPulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }
        @keyframes happyJump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes alertShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(-1deg); }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
        }
        .label { color: #00AA00; }
        .value { font-weight: bold; }
        #message {
            margin-top: 20px;
            font-style: italic;
            color: #00DD00;
            min-height: 1.2em;
        }
        
        /* History Section */
        #history-container {
            margin-top: 20px;
            border-top: 2px dashed #004400;
            padding-top: 10px;
            text-align: left;
        }
        .history-title {
            color: #00AA00;
            font-size: 0.8em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .history-item {
            font-size: 0.8em;
            color: #008800;
            margin-bottom: 4px;
            display: flex;
        }
        .history-time {
            color: #005500;
            margin-right: 10px;
            min-width: 140px;
        }
        .history-msg {
            color: #00AA00;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            opacity: 0.1;
            animation: scan 6s linear infinite;
            pointer-events: none;
            position: absolute;
            top: 0;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0% }
            100% { top: 100% }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div id="monitor">
        <div id="avatar"></div>
        
        <div class="info-row">
            <span class="label">STATUS:</span>
            <span class="value" id="status-val">CONNECTING...</span>
        </div>
        <div class="info-row">
            <span class="label">LAST ACTIVE:</span>
            <span class="value" id="last-active">...</span>
        </div>
        <div class="info-row">
            <span class="label">TASK:</span>
            <span class="value" id="task">...</span>
        </div>
        
        <div id="message"></div>

        <div id="history-container">
            <div class="history-title">Recent Logs</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const FACES = {
            neutral: `
       .---.
     .'  _  '.
    /   [O]   \\
   |  ( _ )  |
    \\  ---  /
     '-----'
   [ BOTTHEW ]`,
            happy: `
       .---.
     .'  ^  '.
    /   [^]   \\
   |  ( v )  |
    \\  ---  /
     '-----'
   [ BOTTHEW ]`,
            working: `
       .---.
     .'  _  '.
    /   [-]   \\
   |  ( o )  |
    \\  ---  /
     '-----'
   [ WORKTHEW ]`,
            alert: `
       .---.
     .'  !  '.
    /   [X]   \\
   |  ( ~ )  |
    \\  ---  /
     '-----'
   [ ERROTHEW ]`
        };

        const ANIMATIONS = {
            neutral: 'anim-idle',
            happy: 'anim-happy',
            working: 'anim-working',
            alert: 'anim-alert'
        };

        async function fetchStatus() {
            try {
                const response = await fetch('status.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // Update Text
                document.getElementById('status-val').textContent = data.status || "UNKNOWN";
                document.getElementById('last-active').textContent = data.last_active || "UNKNOWN";
                document.getElementById('task').textContent = data.task || "IDLE";
                document.getElementById('message').textContent = `"${data.message || ''}"`;

                // Update Avatar & Mood
                const mood = data.mood || 'neutral';
                const avatarEl = document.getElementById('avatar');
                
                // Set ASCII Art
                avatarEl.textContent = FACES[mood] || FACES['neutral'];
                
                // Reset Animations
                avatarEl.className = '';
                avatarEl.classList.add(ANIMATIONS[mood] || ANIMATIONS['neutral']);

                // Handle Alert Color Override on Monitor Border
                const monitor = document.getElementById('monitor');
                if (mood === 'alert') {
                    monitor.style.borderColor = '#FF0000';
                    monitor.style.boxShadow = '0 0 20px #FF0000, 0 0 5px #AA0000 inset';
                    document.body.style.color = '#FF0000';
                } else {
                    monitor.style.borderColor = '#00FF00';
                    monitor.style.boxShadow = '0 0 20px #00FF00, 0 0 5px #00AA00 inset';
                    document.body.style.color = '#00FF00';
                }

                // Update History
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = ''; 
                
                if (data.history && Array.isArray(data.history)) {
                    const pastLogs = data.history.slice(1, 4); 
                    pastLogs.forEach(log => {
                        const row = document.createElement('div');
                        row.className = 'history-item';
                        row.innerHTML = `
                            <span class="history-time">[${log.timestamp}]</span>
                            <span class="history-msg">${log.task}</span>
                        `;
                        historyList.appendChild(row);
                    });
                }

            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 30000); 
    </script>
</body>
</html>
