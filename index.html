<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Botthew Activity Monitor</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
        }
        #monitor {
            border: 4px solid #00FF00;
            padding: 20px;
            width: 600px;
            box-shadow: 0 0 20px #00FF00, 0 0 5px #00AA00 inset;
            text-align: center;
            background: rgba(0, 20, 0, 0.9);
        }
        #avatar {
            white-space: pre;
            font-size: 14px;
            line-height: 14px;
            margin-bottom: 20px;
            color: #00FF00;
            font-weight: bold;
        }
        #status {
            font-size: 2em;
            margin-top: 10px;
            min-height: 1.2em;
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            opacity: 0.1;
            animation: scan 6s linear infinite;
            pointer-events: none;
            position: absolute;
            top: 0;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0% }
            100% { top: 100% }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div id="monitor">
        <div id="avatar">
       .---.
     .'  _  '.
    /   [O]   \
   |  ( _ )  |
    \  ---  /
     '-----'
   [ BOTTHEW ]
        </div>
        <div id="status">Initializing...</div>
    </div>

    <script>
        const statusElement = document.getElementById('status');
        const activities = [
            "SYSTEM ONLINE",
            "SCANNING REPO...",
            "ANALYZING METRICS...",
            "AWAITING INPUT...",
            "OPERATIONAL"
        ];
        let currentIndex = 0;
        const cycleTimeMs = 3000; 

        function updateStatus() {
            statusElement.textContent = activities[currentIndex];
            currentIndex = (currentIndex + 1) % activities.length;
        }

        updateStatus();
        setInterval(updateStatus, cycleTimeMs);
    </script>
</body>
</html>
