<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Botthew Activity Monitor</title>
    <!-- Add timestamp to bust cache -->
    <script src="characters.js?v=2"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
        }
        #monitor {
            border: 4px solid #00FF00;
            padding: 20px;
            width: 600px;
            max-width: 90vw;
            box-shadow: 0 0 20px #00FF00, 0 0 5px #00AA00 inset;
            text-align: center;
            background: rgba(0, 20, 0, 0.9);
            transition: box-shadow 0.5s, border-color 0.5s;
        }
        
        /* Character Party Section */
        #party-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px dashed #004400;
            padding-bottom: 15px;
            overflow-x: auto; /* Allow scroll on very small screens if needed */
        }
        
        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: idleBounce 2s infinite ease-in-out;
        }
        
        .char-art {
            white-space: pre;
            font-size: 12px;
            line-height: 12px;
            font-weight: bold;
            color: #00FF00;
            margin-bottom: 5px;
        }
        
        .char-name {
            font-size: 10px;
            color: #00AA00;
            background: #002200;
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Animations */
        .anim-idle { animation: idleBounce 2s infinite ease-in-out; }
        
        @keyframes idleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
        }
        .label { color: #00AA00; }
        .value { font-weight: bold; }
        #message {
            margin-top: 20px;
            font-style: italic;
            color: #00DD00;
            min-height: 1.2em;
        }
        
        /* History Section */
        #history-container {
            margin-top: 20px;
            border-top: 2px dashed #004400;
            padding-top: 10px;
            text-align: left;
        }
        .history-title {
            color: #00AA00;
            font-size: 0.8em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .history-item {
            font-size: 0.8em;
            color: #008800;
            margin-bottom: 4px;
            display: flex;
        }
        .history-time {
            color: #005500;
            margin-right: 10px;
            min-width: 140px;
        }
        .history-msg {
            color: #00AA00;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            opacity: 0.1;
            animation: scan 6s linear infinite;
            pointer-events: none;
            position: absolute;
            top: 0;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0% }
            100% { top: 100% }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div id="monitor">
        <div id="party-container">
            <!-- Populated by JS -->
        </div>
        
        <div class="info-row">
            <span class="label">STATUS:</span>
            <span class="value" id="status-val">CONNECTING...</span>
        </div>
        <div class="info-row">
            <span class="label">LAST ACTIVE:</span>
            <span class="value" id="last-active">...</span>
        </div>
        <div class="info-row">
            <span class="label">TASK:</span>
            <span class="value" id="task">...</span>
        </div>
        
        <div id="message"></div>

        <div id="history-container">
            <div class="history-title">Recent Logs</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // Render Characters
        const partyContainer = document.getElementById('party-container');
        
        if (typeof CHARACTERS !== 'undefined') {
            CHARACTERS.forEach((char, index) => {
                const charEl = document.createElement('div');
                charEl.className = 'character';
                
                // Add random delay to animation so they don't sync perfectly
                // Using negative delay to start them at different points immediately
                const delay = -(Math.random() * 2); 
                charEl.style.animationDelay = `${delay}s`;
                
                charEl.innerHTML = `
                    <div class="char-art">${char.art}</div>
                    <div class="char-name">${char.name}</div>
                `;
                partyContainer.appendChild(charEl);
            });
        }

        // Status Fetcher
        async function fetchStatus() {
            try {
                // Fetch from Gist Raw URL (High speed, decoupled from Git commits)
                const GIST_URL = "https://gist.githubusercontent.com/botthew/c7197e494c806aa7c9830543fd6a762f/raw/status.json";
                const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // Update Text
                document.getElementById('status-val').textContent = data.status || "UNKNOWN";
                document.getElementById('last-active').textContent = data.last_active || "UNKNOWN";
                document.getElementById('task').textContent = data.task || "IDLE";
                document.getElementById('message').textContent = `"${data.message || ''}"`;

                // Handle Alert Mood (Global Color)
                // Note: We removed the single avatar logic since we have a party now
                // But we still want the screen to flash red on alert
                const mood = data.mood || 'neutral';
                const monitor = document.getElementById('monitor');
                if (mood === 'alert') {
                    monitor.style.borderColor = '#FF0000';
                    monitor.style.boxShadow = '0 0 20px #FF0000, 0 0 5px #AA0000 inset';
                    document.body.style.color = '#FF0000';
                    // Update char colors too
                    document.querySelectorAll('.char-art').forEach(el => el.style.color = '#FF0000');
                } else {
                    monitor.style.borderColor = '#00FF00';
                    monitor.style.boxShadow = '0 0 20px #00FF00, 0 0 5px #00AA00 inset';
                    document.body.style.color = '#00FF00';
                    document.querySelectorAll('.char-art').forEach(el => el.style.color = '#00FF00');
                }

                // Update History
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = ''; 
                
                if (data.history && Array.isArray(data.history)) {
                    const pastLogs = data.history.slice(1, 4); 
                    pastLogs.forEach(log => {
                        const row = document.createElement('div');
                        row.className = 'history-item';
                        row.innerHTML = `
                            <span class="history-time">[${log.timestamp}]</span>
                            <span class="history-msg">${log.task}</span>
                        `;
                        historyList.appendChild(row);
                    });
                }

            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        // Increased poll rate to 5s for real-time feel
        fetchStatus();
        setInterval(fetchStatus, 5000); 
    </script>
</body>
</html>
