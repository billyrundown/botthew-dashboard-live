<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Botthew Activity Monitor</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00FF00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        #monitor {
            border: 4px solid #00FF00;
            padding: 30px;
            width: 500px;
            box-shadow: 0 0 20px #00FF00, 0 0 5px #00AA00 inset;
            text-align: center;
        }
        #status {
            font-size: 3em;
            margin-top: 30px;
            height: 3em;
            transition: color 1s;
        }
        .alert {
            color: #FF0000;
            text-shadow: 0 0 10px #FF0000;
        }
    </style>
</head>
<body>
    <div id="monitor">
        <div id="status">Initializing...</div>
    </div>

    <script>
        const statusElement = document.getElementById('status');
        const activities = [
            "SYSTEM STARTUP...",
            "⚙️ GIT PUSHING...",
            "📧 AGENTMAIL SECURING...",
            "⚙️ WAITING FOR INPUT...",
            "✅ DEPLOYMENT COMPLETE"
        ];
        let currentIndex = 0;
        const cycleTimeMs = 30000; // 30 seconds (Slower cycle)

        function updateStatus() {
            const statusText = activities[currentIndex];
            statusElement.textContent = statusText;
            
            if (statusText.includes("SECURE") || statusText.includes("COMPLETE")) {
                statusElement.classList.add('alert');
            } else {
                statusElement.classList.remove('alert');
            }
            
            currentIndex = (currentIndex + 1) % activities.length;
        }

        updateStatus();
        setInterval(updateStatus, cycleTimeMs);
    </script>
</body>
</html>
