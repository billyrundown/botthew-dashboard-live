<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Botthew Activity Monitor</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            image-rendering: pixelated;
        }
        #monitor {
            border: 4px solid #00FF00;
            padding: 20px;
            width: 600px;
            box-shadow: 0 0 20px #00FF00, 0 0 5px #00AA00 inset;
            text-align: center;
            background: rgba(0, 20, 0, 0.9);
        }
        #avatar {
            white-space: pre;
            font-size: 14px;
            line-height: 14px;
            margin-bottom: 20px;
            color: #00FF00;
            font-weight: bold;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
        }
        .label { color: #00AA00; }
        .value { font-weight: bold; }
        #message {
            margin-top: 20px;
            font-style: italic;
            color: #00DD00;
            min-height: 1.2em;
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            opacity: 0.1;
            animation: scan 6s linear infinite;
            pointer-events: none;
            position: absolute;
            top: 0;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0% }
            100% { top: 100% }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div id="monitor">
        <div id="avatar">
       .---.
     .'  _  '.
    /   [O]   \
   |  ( _ )  |
    \  ---  /
     '-----'
   [ BOTTHEW ]
        </div>
        
        <div class="info-row">
            <span class="label">STATUS:</span>
            <span class="value" id="status-val">CONNECTING...</span>
        </div>
        <div class="info-row">
            <span class="label">LAST ACTIVE:</span>
            <span class="value" id="last-active">...</span>
        </div>
        <div class="info-row">
            <span class="label">TASK:</span>
            <span class="value" id="task">...</span>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                // Add timestamp to prevent caching
                const response = await fetch('status.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                document.getElementById('status-val').textContent = data.status || "UNKNOWN";
                document.getElementById('last-active').textContent = data.last_active || "UNKNOWN";
                document.getElementById('task').textContent = data.task || "IDLE";
                document.getElementById('message').textContent = `"${data.message || ''}"`;
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('status-val').textContent = "OFFLINE";
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 30000); // Poll every 30s
    </script>
</body>
</html>
